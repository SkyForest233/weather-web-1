name: Build Android APK

# Builds the Drizz APK on every push, on demand, and on version tags.
# The APK is uploaded as a workflow artifact on every run; tagging v* (or
# ticking "Create release" on a manual run) also publishes a GitHub Release
# with a directly-installable .apk.

on:
  push:
    branches:
      - main
      - 'arena/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with the APK'
        type: boolean
        required: false
        default: false
  pull_request:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (dependency caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Drizz-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: Publish APK to GitHub Releases
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.create_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: Drizz-debug-APK
          path: apk

      - name: Name the APK
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="v1.0.${GITHUB_RUN_NUMBER}"
          fi
          cp "apk/app-debug.apk" "Drizz-${VERSION}.apk"
          echo "APK_NAME=Drizz-${VERSION}.apk" >> "$GITHUB_ENV"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: Drizz ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          files: ${{ env.APK_NAME }}
          generate_release_notes: true
